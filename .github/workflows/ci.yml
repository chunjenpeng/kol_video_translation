name: CI

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build Backend
      working-directory: ./backend
      run: |
        go mod download
        go build -v ./...
    
    - name: Verify Go Code Format
      working-directory: ./backend
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Go code is not formatted:"
          gofmt -s -l .
          exit 1
        fi

  test-python:
    name: Test Python Service
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Check Python Syntax
      working-directory: ./python_service
      run: |
        python -m py_compile app.py
        python -m py_compile services/*.py
    
    - name: Install Python dependencies (basic)
      working-directory: ./python_service
      run: |
        pip install flask flask-cors requests python-dotenv
    
    - name: Verify Python imports
      working-directory: ./python_service
      run: |
        python -c "import flask; print('Flask OK')"
        python -c "from flask_cors import CORS; print('Flask-CORS OK')"

  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
    
    - name: Check for build artifacts
      working-directory: ./frontend
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build successful"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Docker Compose Configuration
      run: |
        docker-compose config
