name: CI

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build Backend
      working-directory: ./backend
      run: |
        go mod download
        go build -v ./...
    
    - name: Verify Go Code Format
      working-directory: ./backend
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Go code is not formatted:"
          gofmt -s -l .
          exit 1
        fi

  test-python:
    name: Test Python Service
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Check Python Syntax
      working-directory: ./python_service
      run: |
        python -m py_compile app.py
        python -m py_compile services/*.py
        python -m py_compile test_youtube_download.py
    
    - name: Install Python dependencies (basic)
      working-directory: ./python_service
      run: |
        pip install flask flask-cors requests python-dotenv yt-dlp
    
    - name: Verify Python imports
      working-directory: ./python_service
      run: |
        python -c "import flask; print('Flask OK')"
        python -c "from flask_cors import CORS; print('Flask-CORS OK')"
        python -c "import yt_dlp; print('yt-dlp OK')"
    
    - name: Run YouTube Download Functional Test
      working-directory: ./python_service
      continue-on-error: true  # Allow failure due to YouTube API rate limiting
      run: |
        python test_youtube_download.py
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: youtube-test-downloads
        path: python_service/test_downloads/
        retention-days: 7

  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
    
    - name: Check for build artifacts
      working-directory: ./frontend
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build successful"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Docker Compose Configuration
      run: |
        docker-compose config

  test-e2e-browser:
    name: End-to-End Browser Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-python, test-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Playwright and dependencies
      run: |
        pip install playwright
        playwright install chromium
        playwright install-deps chromium
    
    - name: Build and start all services
      run: |
        docker-compose up -d --build
    
    - name: Wait for services to be ready
      run: |
        echo "Waiting 60 seconds for services to start..."
        sleep 60
        
        echo "Checking service health..."
        docker-compose ps
        
        echo "Checking frontend..."
        curl -f http://localhost:3000 || exit 1
        
        echo "Checking backend..."
        curl -f http://localhost:8080 || exit 1
        
        echo "All services are up!"
    
    - name: Run Browser E2E Test
      run: |
        python test_e2e_browser.py
    
    - name: Show service logs on failure
      if: failure()
      run: |
        echo "=== Backend Logs ==="
        docker-compose logs backend
        echo "=== Python Service Logs ==="
        docker-compose logs python-service
        echo "=== Frontend Logs ==="
        docker-compose logs frontend
    
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-screenshots
        path: screenshots/
        retention-days: 7
    
    - name: Upload test videos
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-videos
        path: test_videos/
        retention-days: 7
    
    - name: Cleanup
      if: always()
      run: |
        docker-compose down -v
