version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHON_SERVICE_URL=http://python-service:5000
    volumes:
      - ./output:/app/output
    depends_on:
      - python-service
    networks:
      - app-network

  python-service:
    build:
      context: ./python_service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - BACKEND_API_URL=http://backend:8080
    volumes:
      - ./output:/app/output
      - ./temp:/app/temp
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  output:
  temp:
